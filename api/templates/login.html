<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · CheckinOS PMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/print.css" media="print">
  <style>
    .login-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #0B1120;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      padding: 32px 28px;
    }
    .brand-mark-circle {
      width: 44px;
      height: 44px;
      background: #0F172A;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    .login-header h1 {
      font-size: 21px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .login-header p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      margin-bottom: 20px;
    }
    .demo-role-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: all 180ms ease;
    }
    .demo-role-card:hover {
      background: #FFFFFF;
      border-color: #0F172A;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }
    .demo-role-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .demo-arrow {
      font-size: 16px;
      color: #94A3B8;
      transition: transform 150ms ease;
    }
    .demo-role-card:hover .demo-arrow {
      color: #0F172A;
      transform: translateX(3px);
    }
    .error-alert-banner {
      background-color: var(--danger-bg);
      border: 1px solid #FCA5A5;
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }
    .session-banner {
      margin-bottom: 16px;
      padding: 12px 14px;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 10px;
      font-size: 12px;
      color: #1E40AF;
      display: none;
    }
  </style>
</head>
<body class="login-viewport">
  <div class="login-card">
    <div class="login-header" style="text-align: center;">
      <div class="brand-mark-circle">
        <svg style="width:22px; height:22px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
        </svg>
      </div>
      <h1>Sign in to CheckinOS</h1>
      <p>Log in as Admin or Staff, or use custom credentials</p>
    </div>

    <!-- Active Session Notification Banner -->
    <div id="active-session-banner" class="session-banner">
      <div style="font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between;">
        <span>Active Session Detected</span>
        <span id="session-role-badge" style="font-size: 10px; background: #DBEAFE; color: #1E40AF; padding: 2px 6px; border-radius: 4px; text-transform: uppercase;"></span>
      </div>
      <div id="active-session-desc" style="color: #2563EB; font-size: 11.5px; margin-bottom: 8px;"></div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <a href="/app" class="btn btn-primary btn-sm" style="font-size: 11.5px; height: 28px; padding: 0 12px;">Go to Dashboard &rarr;</a>
        <button type="button" class="btn btn-secondary btn-sm" onclick="clearExistingSession()" style="font-size: 11.5px; height: 28px; padding: 0 10px;">Switch User</button>
      </div>
    </div>

    <!-- Error Alert Banner -->
    <div id="login-error-banner" class="error-alert-banner"></div>

    <!-- 1-Click Demo Profiles (Admin & Staff) -->
    <div style="margin-bottom: 20px;">
      <div style="font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; text-align: center;">
        Explore Live Demo As:
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <!-- 1. Hotel Admin Demo -->
        <button type="button" class="demo-role-card" id="btn-login-admin" onclick="loginDemo('admin', 'admin123', this)">
          <div class="demo-role-icon" style="background: #0F172A; color: #FFFFFF;">
            <svg style="width:18px; height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
            </svg>
          </div>
          <div style="flex: 1; text-align: left;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-weight: 700; font-size: 13.5px; color: #0F172A;">Hotel Admin / Owner</span>
              <span style="background: #F1F5F9; color: #0F172A; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid #E2E8F0;">Full Access</span>
            </div>
            <div style="font-size: 11px; color: #64748B; margin-top: 2px;">
              KPI Dashboard, Rate Matrix, Folios, Night Audit &amp; Policies
            </div>
          </div>
          <div class="demo-arrow">&rarr;</div>
        </button>

        <!-- 2. Staff Demo -->
        <button type="button" class="demo-role-card" id="btn-login-staff" onclick="loginDemo('staff', 'staff123', this)">
          <div class="demo-role-icon" style="background: #0284C7; color: #FFFFFF;">
            <svg style="width:18px; height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
          </div>
          <div style="flex: 1; text-align: left;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-weight: 700; font-size: 13.5px; color: #0F172A;">Front Desk &amp; Staff</span>
              <span style="background: #E0F2FE; color: #0369A1; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid #BAE6FD;">Operations</span>
            </div>
            <div style="font-size: 11px; color: #64748B; margin-top: 2px;">
              Guest Walk-ins, Room Rack, Housekeeping Dispatch
            </div>
          </div>
          <div class="demo-arrow">&rarr;</div>
        </button>
      </div>
    </div>

    <!-- Divider -->
    <div style="display: flex; align-items: center; margin: 18px 0 16px;">
      <div style="flex: 1; height: 1px; background: #E2E8F0;"></div>
      <span style="padding: 0 10px; font-size: 10.5px; color: #94A3B8; text-transform: uppercase; font-weight: 600; letter-spacing: 0.04em;">Or sign in with credentials</span>
      <div style="flex: 1; height: 1px; background: #E2E8F0;"></div>
    </div>

    <!-- Custom Credential Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-ident">Email or Username <span style="color:var(--danger);">*</span></label>
        <input
          type="text"
          id="login-ident"
          class="input-field"
          placeholder="admin, staff or user@hotel.com"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group" style="margin-top: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <label class="form-label" for="login-pw">Password <span style="color:var(--danger);">*</span></label>
          <a href="#" id="forgot-pw-link" style="font-size: 11px; color: var(--text-secondary);">Forgot password?</a>
        </div>
        <input
          type="password"
          id="login-pw"
          class="input-field"
          placeholder="••••••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary btn-md" style="width: 100%; height: 42px; margin-top: 14px; font-weight: 600; font-size: 13px;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-secondary);">
      New hotel property? <a href="/demo" style="color: var(--brand-primary); font-weight: 600; text-decoration: underline;">Request a Demo</a>
    </div>

    <div style="text-align: center; margin-top: 22px; font-size: 12px; color: var(--text-tertiary);">
      &copy; 2026 CheckinOS PMS · Commercial SaaS v1.0 · Developed by <strong style="color: var(--text); font-weight: 600;">Gulshan</strong>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <script>
    window.clearExistingSession = () => {
      API.setToken(null);
      API.setUser(null);
      const banner = document.getElementById('active-session-banner');
      if (banner) banner.style.display = 'none';
      UI.toast('Switched user. Please select a profile or log in.', 'info');
    };

    window.loginDemo = async (ident, pw, btnEl) => {
      const errBanner = document.getElementById('login-error-banner');
      errBanner.style.display = 'none';

      // Pre-fill fields for user visibility
      document.getElementById('login-ident').value = ident;
      document.getElementById('login-pw').value = pw;

      const originalHtml = btnEl ? btnEl.innerHTML : '';
      if (btnEl) {
        btnEl.style.opacity = '0.7';
        btnEl.style.pointerEvents = 'none';
      }

      try {
        UI.toast(`Authenticating as ${ident.toUpperCase()}...`, 'info');
        await API.login(ident, pw);
        window.location.href = '/app';
      } catch (err) {
        errBanner.textContent = err.message || 'Demo login failed.';
        errBanner.style.display = 'block';
        if (btnEl) {
          btnEl.style.opacity = '1';
          btnEl.style.pointerEvents = 'auto';
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      // Show active session if present, but NEVER auto-redirect away from the login screen
      const existingUser = API.getUser();
      const existingToken = API.getToken();

      if (existingToken) {
        const sessionBanner = document.getElementById('active-session-banner');
        const sessionDesc = document.getElementById('active-session-desc');
        const sessionRoleBadge = document.getElementById('session-role-badge');

        if (sessionBanner && sessionDesc) {
          const userName = existingUser ? (existingUser.full_name || existingUser.username || existingUser.email) : 'User';
          const userRole = existingUser ? (existingUser.role || 'Member') : 'Active';
          sessionDesc.textContent = `You are currently authenticated as ${userName}.`;
          if (sessionRoleBadge) sessionRoleBadge.textContent = userRole;
          sessionBanner.style.display = 'block';
        }
      }

      const form = document.getElementById('login-form');
      const errBanner = document.getElementById('login-error-banner');
      const submitBtn = document.getElementById('login-submit-btn');
      const forgotLink = document.getElementById('forgot-pw-link');

      forgotLink.onclick = (e) => {
        e.preventDefault();
        UI.toast('Contact property administrator or system manager for password recovery.', 'info');
      };

      form.onsubmit = async (e) => {
        e.preventDefault();
        errBanner.style.display = 'none';

        if (!UI.validateForm(form)) return;

        const ident = document.getElementById('login-ident').value.trim();
        const pw = document.getElementById('login-pw').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
          await API.login(ident, pw);
          window.location.href = '/app';
        } catch (err) {
          errBanner.textContent = err.message || 'Invalid credentials provided.';
          errBanner.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      };
    });
  </script>
</body>
</html>
